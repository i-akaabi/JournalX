<!DOCTYPE html>
<html lang="de">

<head>

    <!-- Zeichencodierung -->
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser Titel -->
    <title>JournalX</title>

    <style>

        /* Gesamte Seite */
        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background-color: #0f172a;

            color: white;

            display: flex;

        }

        /* Sidebar */
        .sidebar {

            width: 250px;

            background-color: #111827;

            height: 100vh;

            padding: 30px;

            box-sizing: border-box;

        }

        /* Logo */
        .logo {

            font-size: 28px;

            font-weight: bold;

            color: #3b82f6;

            margin-bottom: 50px;

        }

        /* Sidebar Links */
        .sidebar a {

            display: block;

            color: white;

            text-decoration: none;

            margin-bottom: 20px;

            font-size: 18px;

        }

        /* Hauptbereich */
        .main {

            flex: 1;

            padding: 50px;

        }

        /* Überschrift */
        h1 {

            margin-top: 0;

            color: #3b82f6;

        }

        /* Formular */
        .journal-form {

            margin-bottom: 40px;

        }

        /* Eingabefeld */
        input {

            width: 100%;

            padding: 15px;

            margin-bottom: 20px;

            border: none;

            border-radius: 10px;

            background-color: #1e293b;

            color: white;

            font-size: 16px;

            box-sizing: border-box;

        }

        /* Textfeld */
        textarea {

            width: 100%;

            height: 200px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background-color: #1e293b;

            color: white;

            font-size: 16px;

            resize: none;

            box-sizing: border-box;

        }

        /* Buttons */
        button {

            margin-top: 20px;

            padding: 14px 28px;

            border: none;

            border-radius: 10px;

            background-color: #3b82f6;

            color: white;

            font-size: 16px;

            cursor: pointer;

            margin-right: 10px;

        }

        /* Eintragskarten */
        .entry-card {

            background-color: #1e293b;

            padding: 25px;

            border-radius: 15px;

            margin-bottom: 20px;

        }

        .entry-card h3 {

            color: #3b82f6;

        }

    </style>

</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <!-- Logo -->
        <div class="logo">

            JournalX

        </div>

        <!-- Navigation -->
        <a href="/">Home</a>

        <a href="/login-page">Login</a>

        <a href="/register-page">Registrieren</a>

    </div>

    <!-- Hauptbereich -->
    <div class="main">

        <!-- Überschrift -->
        <h1>Dein Journal</h1>

        <!-- Journal Formular -->
        <form class="journal-form" id="entryForm">

            <!-- Titel -->
            <input
                type="text"
                id="title"
                placeholder="Titel deines Eintrags"
            >

            <!-- Inhalt -->
            <textarea
                id="content"
                placeholder="Schreibe deine Gedanken hier..."
            ></textarea>

            <!-- Speichern -->
            <button type="submit">

                Eintrag speichern

            </button>

        </form>

        <!-- Einträge -->
        <div id="entriesContainer"></div>

    </div>

    <script>

        // EINTRAG SPEICHERN

        document.getElementById("entryForm").addEventListener("submit", async function(event) {

            // Verhindert Neuladen
            event.preventDefault();

            // Titel lesen
            const title = document.getElementById("title").value;

            // Inhalt lesen
            const content = document.getElementById("content").value;

            // Anfrage an Flask senden
            const response = await fetch("/entries", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    title: title,

                    content: content

                })

            });

            // Antwort lesen
            const data = await response.json();

            // Nachricht anzeigen
            alert(data.message);

            // Einträge neu laden
            loadEntries();

        });



        // EINTRÄGE LADEN

        async function loadEntries() {

            // GET Request
            const response = await fetch("/entries");

            // JSON lesen
            const entries = await response.json();

            // Bereich auswählen
            const container = document.getElementById("entriesContainer");

            // Vorherigen Inhalt löschen
            container.innerHTML = "";

            // Alle Einträge durchlaufen
            entries.forEach(entry => {

                // HTML Karten hinzufügen
                container.innerHTML += `

                    <div class="entry-card">

                        <h3>${entry.title}</h3>

                        <p>${entry.content}</p>

                        <button onclick="editEntry(${entry.id})">

                            Bearbeiten

                        </button>

                        <button onclick="deleteEntry(${entry.id})">

                            Löschen

                        </button>

                    </div>

                `;

            });

        }



        // EINTRAG BEARBEITEN

        async function editEntry(id) {

            // Neuer Titel
            const newTitle = prompt("Neuer Titel:");

            // Neuer Inhalt
            const newContent = prompt("Neuer Inhalt:");

            // Prüfen ob Felder leer sind
            if (!newTitle || !newContent) {

                alert("Titel und Inhalt dürfen nicht leer sein");

                return;

            }

            // PUT Request
            await fetch(`/entries/${id}`, {

                method: "PUT",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    title: newTitle,

                    content: newContent

                })

            });

            // Neu laden
            loadEntries();

        }



        // EINTRAG LÖSCHEN

        async function deleteEntry(id) {

            // DELETE Request
            await fetch(`/entries/${id}`, {

                method: "DELETE"

            });

            // Neu laden
            loadEntries();

        }



        // Beim Laden automatisch Einträge laden
        loadEntries();

    </script>

</body>

</html>
